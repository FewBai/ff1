name: FF1 Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find and unpack Step 76 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Step 76 ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf build-src android-project
          mkdir build-src android-project

          unzip -q "$ZIP" -d build-src

          PROJECT="$(
            find build-src -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              -print -quit |
            xargs -r dirname
          )"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            exit 1
          fi

          echo "Android project root: $PROJECT"

          cp -a "$PROJECT"/. android-project/

      - name: Install Gradle 8.13
        run: |
          curl -fsSL \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

          unzip -q gradle.zip

          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        working-directory: android-project
        run: |
          gradle --version
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF1Android-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
