name: FF1 Android Step 3.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle-bootstrap:
    name: Bootstrap Gradle + Verify Project
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            \( -iname '*.zip' -o -iname '*.ZIP' \) \
            | grep -E 'FF1|Android|Codemagic' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FF1 Android ZIP not found."
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "ZIP discovery: OK"
          echo "Using: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ff1_android_project
          mkdir -p ff1_android_project

          unzip -q "$ZIP_FILE" -d ff1_android_project

          echo "ZIP extraction: OK"

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find ff1_android_project \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_ROOT"

      - name: Inspect Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "===== settings.gradle.kts ====="
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          elif [ -f settings.gradle ]; then
            cat settings.gradle
          fi

          echo
          echo "===== root build file ====="
          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          elif [ -f build.gradle ]; then
            cat build.gradle
          fi

          echo
          echo "===== gradle.properties ====="
          if [ -f gradle.properties ]; then
            cat gradle.properties
          fi

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Gradle ====="
          gradle --version

      - name: Run Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "Running Gradle tasks"
          echo "========================================"

          gradle tasks --no-daemon --stacktrace

      - name: Step 3.1 success
        shell: bash
        run: |
          echo "========================================"
          echo "FF1 ANDROID STEP 3.1 SUCCESS"
          echo "========================================"
          echo "Gradle installed: OK"
          echo "Android project detected: OK"
          echo "gradle tasks: OK"
          echo "========================================"