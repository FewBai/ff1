name: FF1 Android Step 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build FF1 Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find FF1 Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Searching for FF1 Android ZIP"
          echo "========================================"

          ZIP_FILE=""

          while IFS= read -r file; do
            if echo "$file" | grep -Eiq 'FF1|Android|Codemagic'; then
              ZIP_FILE="$file"
              break
            fi
          done < <(find . -maxdepth 5 -type f -iname '*.zip' -print)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FF1 Android ZIP not found."
            echo
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP discovery: OK"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Extracting Android project"
          echo "========================================"

          rm -rf ff1_android_project
          mkdir -p ff1_android_project

          unzip -q "$ZIP_FILE" -d ff1_android_project

          echo "ZIP extraction: OK"

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Detecting Android Gradle project"
          echo "========================================"

          SETTINGS_FILE=""

          SETTINGS_FILE="$(find ff1_android_project \
            -type f \
            -name 'settings.gradle.kts' \
            -print \
            -quit || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find ff1_android_project \
              -type f \
              -name 'settings.gradle' \
              -print \
              -quit || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            echo
            echo "Files found in extracted project:"
            find ff1_android_project -maxdepth 4 -type f -print | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project detected: OK"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Gradle version"
          echo "========================================"

          gradle --version

          echo "Gradle 8.13: OK"

      - name: Run Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Running Gradle tasks"
          echo "========================================"

          cd "$PROJECT_ROOT"

          gradle tasks \
            --no-daemon \
            --stacktrace

          echo "Gradle tasks: OK"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Starting assembleDebug"
          echo "========================================"

          cd "$PROJECT_ROOT"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

          echo "========================================"
          echo "assembleDebug: SUCCESS"
          echo "========================================"

      - name: Find generated APK
        shell: bash