name: FF1 Android Step 3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gradle-check:
    name: Gradle Environment + Tasks Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            \( -iname '*.zip' -o -iname '*.ZIP' \) \
            | grep -E 'FF1|Android|Codemagic' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FF1 Android ZIP not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "ZIP discovery: OK"
          echo "Using: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ff1_android_project
          mkdir -p ff1_android_project

          unzip -q "$ZIP_FILE" -d ff1_android_project

          echo "ZIP extraction: OK"

      - name: Detect Gradle project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          SETTINGS_FILE="$(find ff1_android_project \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit || true)"

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Gradle project not found."
            find ff1_android_project -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) \
              -print
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Gradle project detection: OK"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            echo
            echo "Project root contents:"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper: OK"
          echo "Gradle wrapper version:"
          ./gradlew --version

      - name: Run Gradle tasks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "========================================"
          echo "Running Gradle tasks"
          echo "========================================"

          ./gradlew tasks --no-daemon --stacktrace

      - name: Step 3 success
        shell: bash
        run: |
          echo "========================================"
          echo "FF1 ANDROID STEP 3 SUCCESS"
          echo "========================================"
          echo "Java 17: OK"
          echo "ZIP discovery: OK"
          echo "ZIP extraction: OK"
          echo "Gradle project: OK"
          echo "Gradle wrapper: OK"
          echo "gradle tasks: OK"
          echo "========================================"