name: FF1 Android Step 1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-environment:
    name: Checkout + Java 17 + Android SDK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Java ====="
          java -version

          echo
          echo "===== Android SDK ====="

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID SDK: $SDK"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager:"
            sdkmanager --version
          else
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            if [ -x "$SDKMANAGER" ]; then
              "$SDKMANAGER" --version
            else
              echo "ERROR: sdkmanager not found"
              exit 1
            fi
          fi

          echo
          echo "===== SDK directory ====="
          ls -la "$SDK" | head -30

      - name: Step 1 success
        shell: bash
        run: |
          echo "========================================"
          echo "FF1 ANDROID STEP 1 SUCCESS"
          echo "========================================"
          echo "Checkout: OK"
          echo "Java 17: OK"
          echo "Android SDK: OK"
          echo "========================================"