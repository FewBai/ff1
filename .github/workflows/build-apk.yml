name: FF1 Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Find and unpack Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android ZIP..."

          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          rm -rf build-src android-project

          mkdir -p build-src
          mkdir -p android-project

          unzip -q "$ZIP" -d build-src

          echo "ZIP extracted."

          PROJECT="$(
            find build-src \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print -quit |
            xargs -r dirname
          )"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            echo "ZIP contents:"
            find build-src -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Android project root:"
          echo "$PROJECT"

          cp -a "$PROJECT"/. android-project/

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Project root ====="
          ls -la android-project

          echo
          echo "===== Gradle files ====="

          find android-project \
            -maxdepth 3 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            -print

          echo
          echo "===== Resource files ====="

          find android-project/app/src/main/res \
            -type f \
            -name "*.xml" \
            -print 2>/dev/null || true

      - name: Fix duplicate AppTheme resources
        shell: bash
        run: |
          set -euo pipefail

          RES_DIR="android-project/app/src/main/res"

          if [ ! -d "$RES_DIR" ]; then
            echo "ERROR: Resource directory not found:"
            echo "$RES_DIR"
            exit 1
          fi

          echo "Searching for AppTheme definitions..."

          MATCHES="$(
            grep -RIl \
              --include="*.xml" \
              'name="AppTheme"' \
              "$RES_DIR" \
              2>/dev/null || true
          )"

          echo "AppTheme definitions:"
          echo "$MATCHES"

          COUNT=0

          if [ -n "$MATCHES" ]; then
            COUNT="$(
              printf "%s\n" "$MATCHES" |
              sed "/^$/d" |
              wc -l
            )"
          fi

          echo "AppTheme definition files: $COUNT"

          if [ "$COUNT" -gt 1 ]; then

            THEMES_FILE="$RES_DIR/values/themes.xml"
            STYLES_FILE="$RES_DIR/values/styles.xml"

            if [ -f "$THEMES_FILE" ] && [ -f "$STYLES_FILE" ]; then

              if grep -q 'name="AppTheme"' "$THEMES_FILE" &&
                 grep -q 'name="AppTheme"' "$STYLES_FILE"; then

                echo "Removing duplicate AppTheme from styles.xml..."

                python3 - <<'PY'
from pathlib import Path
import re

path = Path(
    "android-project/app/src/main/res/values/styles.xml"
)

if not path.exists():
    raise SystemExit(0)

text = path.read_text(encoding="utf-8")

pattern = re.compile(
    r'\s*<style\s+name="AppTheme"[^>]*>.*?</style>\s*',
    re.DOTALL
)

new_text, count = pattern.subn(
    "\n",
    text,
    count=1
)

if count:
    path.write_text(
        new_text,
        encoding="utf-8"
    )
    print("Duplicate AppTheme removed.")
else:
    print("AppTheme block not found.")
PY

              fi
            fi
          fi

          echo
          echo "===== AppTheme definitions after fix ====="

          grep -RIn \
            --include="*.xml" \
            'name="AppTheme"' \
            "$RES_DIR" \
            2>/dev/null || true

      - name: Validate Android resources
        shell: bash
        run: |
          set -euo pipefail

          RES_DIR="android-project/app/src/main/res"

          COUNT="$(
            grep -RIl \
              --include="*.xml" \
              'name="AppTheme"' \
              "$RES_DIR" \
              2>/dev/null |
            sed "/^$/d" |
            wc -l
          )"

          echo "AppTheme definition count: $COUNT"

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: AppTheme is still duplicated."

            grep -RIn \
              --include="*.xml" \
              'name="AppTheme"' \
              "$RES_DIR" \
              2>/dev/null || true

            exit 1
          fi

          echo "Android resource validation passed."

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip

          unzip -q gradle.zip

          echo "$PWD/gradle-8.13/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Java ====="
          java -version

          echo
          echo "===== Gradle ====="
          gradle --version

          echo
          echo "===== Android SDK ====="
          echo "$ANDROID_HOME"

      - name: Build Debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Android build..."

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for APK..."

          find android-project \
            -type f \
            -name "*.apk" \
            -print

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="android-project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-debug.apk was not generated."

            echo
            echo "Available APK files:"

            find android-project \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF1Android-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
