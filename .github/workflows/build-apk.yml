name: FF1 Android Step 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build FF1 Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find FF1 Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 5 -type f -iname '*.zip' -print \
            | grep -Ei 'FF1|Android|Codemagic' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FF1 Android ZIP not found."
            echo
            echo "Available ZIP files:"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP discovery: OK"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ff1_android_project
          mkdir -p ff1_android_project

          unzip -q "$ZIP_FILE" -d ff1_android_project

          echo "ZIP extraction: OK"

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find ff1_android_project \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find ff1_android_project \
              -type f \
              -name 'settings.gradle' \
              -print -quit || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project detected: OK"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          echo "Gradle 8.13