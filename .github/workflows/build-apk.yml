name: FF1 Android Step 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-project:
    name: ZIP Discovery + Android Project Inspection
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Repository root ====="
          pwd

          echo
          echo "===== Files ====="
          find . -maxdepth 2 -type f | sort | head -200

      - name: Find FF1 Android ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Searching for Android ZIP ====="

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            \( -iname '*.zip' -o -iname '*.ZIP' \) \
            | grep -E 'FF1|Android|Codemagic' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: FF1 Android ZIP not found."
            echo
            echo "Available ZIP files:"
            find . -type f \( -iname '*.zip' -o -iname '*.ZIP' \) -print || true
            exit 1
          fi

          echo "ZIP discovery: OK"
          echo "ZIP_FILE=$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Inspect ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ZIP information ====="
          ls -lh "$ZIP_FILE"

          echo
          echo "===== ZIP contents ====="
          unzip -l "$ZIP_FILE" | head -200

          echo
          echo "ZIP inspection: OK"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ff1_android_project
          mkdir -p ff1_android_project

          unzip -q "$ZIP_FILE" -d ff1_android_project

          echo "ZIP extraction: OK"

          echo
          echo "===== Extracted files ====="
          find ff1_android_project -maxdepth 4 -type f | sort | head -300

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Android project detection ====="

          PROJECT_ROOT=""

          if find ff1_android_project -name settings.gradle -o -name settings.gradle.kts | grep -q .; then
            PROJECT_ROOT="$(find ff1_android_project \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit | xargs dirname)"
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android Gradle project was not detected."
            echo
            echo "Searching for Gradle files:"
            find ff1_android_project \
              \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) \
              -print
            exit 1
          fi

          echo "Android project detection: OK"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Inspect Android project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Android project root ====="
          echo "$PROJECT_ROOT"

          cd "$PROJECT_ROOT"

          echo
          echo "===== Project files ====="
          find . -maxdepth 3 -type f | sort | head -300

          echo
          echo "===== Gradle files ====="
          find . \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name gradle.properties \
            -o -name gradlew \) \
            -print

          echo
          echo "===== Android manifests ====="
          find . -name AndroidManifest.xml -print

          echo
          echo "===== Project inspection: OK"

      - name: Step 2 success
        shell: bash
        run: |
          echo "========================================"
          echo "FF1 ANDROID STEP 2 SUCCESS"
          echo "========================================"
          echo "ZIP discovery: OK"
          echo "ZIP extraction: OK"
          echo "Android project detection: OK"
          echo "Project inspection: OK"
          echo "========================================"